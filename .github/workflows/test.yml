name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_naija_oracle
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    
    - name: Install dependencies
      run: |
        cd backend
        uv sync --dev
    
    - name: Set up environment variables
      run: |
        cd backend
        cat > .env << EOF
        GROQ_API_KEY=test_key
        SUPABASE_URL=https://test.supabase.co
        SUPABASE_ANON_KEY=test_anon_key
        SUPABASE_SERVICE_KEY=test_service_key
        DATABASE_URL=postgresql://postgres:test_password@localhost:5432/test_naija_oracle
        JWT_SECRET_KEY=test_secret_key
        EOF
    
    - name: Run tests with coverage
      run: |
        cd backend
        uv run pytest --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage-${{ matrix.python-version }}
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage-${{ matrix.python-version }}
        path: backend/htmlcov/

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run tests
      run: |
        cd frontend
        npm run test:coverage
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: frontend/coverage/

  ml-training-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-ml-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-ml-
    
    - name: Install dependencies
      run: |
        cd ml_training
        uv sync --dev
    
    - name: Run ML tests
      run: |
        cd ml_training
        uv run pytest --cov=scripts --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./ml_training/coverage.xml
        flags: ml-training
        name: ml-training-coverage
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: ml-training-coverage
        path: ml_training/htmlcov/

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_naija_oracle
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install backend dependencies
      run: |
        cd backend
        uv sync --dev
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Set up test environment
      run: |
        cd backend
        cat > .env << EOF
        GROQ_API_KEY=test_key
        SUPABASE_URL=https://test.supabase.co
        SUPABASE_ANON_KEY=test_anon_key
        SUPABASE_SERVICE_KEY=test_service_key
        DATABASE_URL=postgresql://postgres:test_password@localhost:5432/test_naija_oracle
        JWT_SECRET_KEY=test_secret_key
        REDIS_URL=redis://localhost:6379
        EOF
    
    - name: Run database migrations
      run: |
        cd backend
        uv run python -c "
        import asyncio
        from app.database import init_db
        asyncio.run(init_db())
        "
    
    - name: Start backend server
      run: |
        cd backend
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Run integration tests
      run: |
        cd backend
        uv run pytest tests/integration/ -v --tb=short
    
    - name: Run API tests
      run: |
        cd backend
        uv run pytest tests/test_routers.py -v --tb=short

  performance-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        cd backend
        uv sync --dev
    
    - name: Run performance tests
      run: |
        cd backend
        uv run pytest tests/performance/ -v --benchmark-only
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: backend/performance-results/

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security scan
      run: |
        pip install bandit[toml]
        bandit -r backend/app -f json -o bandit-report.json || true
    
    - name: Run safety check
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        cd backend
        uv sync --dev
    
    - name: Run Black formatting check
      run: |
        cd backend
        uv run black --check .
    
    - name: Run isort import sorting check
      run: |
        cd backend
        uv run isort --check-only .
    
    - name: Run flake8 linting
      run: |
        cd backend
        uv run flake8 .
    
    - name: Run mypy type checking
      run: |
        cd backend
        uv run mypy app/ --ignore-missing-imports
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint

  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend image
      run: |
        docker build -t naija-oracle-backend:test ./backend
    
    - name: Build frontend image
      run: |
        docker build -t naija-oracle-frontend:test ./frontend
    
    - name: Test Docker images
      run: |
        # Test backend container
        docker run --rm -d --name test-backend \
          -e GROQ_API_KEY=test \
          -e SUPABASE_URL=test \
          -e SUPABASE_ANON_KEY=test \
          naija-oracle-backend:test
        
        sleep 10
        
        # Health check
        docker exec test-backend curl -f http://localhost:8000/health || exit 1
        
        # Cleanup
        docker stop test-backend
