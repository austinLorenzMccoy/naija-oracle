[project]
name = "naija-oracle-backend"
version = "1.0.0"
description = "Backend API for Naija Oracle - LLM agents that simulate Nigerian consumer voices"
authors = [
    {name = "Chibueze Augustine Chidera", email = "chidera@example.com"}
]
# readme = "README.md"  # Commented out to fix Docker build
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["llm", "recommendation", "nigerian", "cultural-ai", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "groq>=0.13.0",
    "supabase>=2.10.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
]
ml = [
    "sentence-transformers>=3.3.1",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "mlflow>=2.19.0",
    "torch>=2.2.0,<2.5.0",
    "transformers>=4.47.1",
]

[project.urls]
Homepage = "https://github.com/austinLorenzMccoy/naija-oracle"
Repository = "https://github.com/austinLorenzMccoy/naija-oracle"
Documentation = "https://naija-oracle.docs.com"
"Bug Tracker" = "https://github.com/austinLorenzMccoy/naija-oracle/issues"

[project.scripts]
naija-oracle = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
