[project]
name = "naija-oracle-ml"
version = "1.0.0"
description = "ML training pipeline for Naija Oracle - Cultural AI models"
authors = [
    {name = "Chibueze Augustine Chidera", email = "chidera@example.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["machine-learning", "llm", "nigerian", "cultural-ai", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.5.1",
    "transformers>=4.47.1",
    "sentence-transformers>=3.3.1",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "mlflow>=2.19.0",
    "bert-score>=0.4.2",
    "rouge-score>=0.1.2",
    "datasets>=3.0.1",
    "accelerate>=0.34.2",
    "wandb>=0.18.5",
    "optuna>=4.1.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.9.2",
    "plotly>=5.24.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.5",
    "tqdm>=4.67.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.4",
    "fastapi>=0.115.6",
    "supabase>=2.10.0",
    "groq>=0.13.0",
    "dvc>=3.50.0",
    "dvclive>=3.0.0",
    "dagshub>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/example/naija-oracle"
Repository = "https://github.com/example/naija-oracle"
Documentation = "https://naija-oracle.docs.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "jupyterlab>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
